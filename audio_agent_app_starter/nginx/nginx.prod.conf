# nginx/nginx.prod.conf - Production Nginx Configuration

user nginx;
worker_processes auto; # Adjust based on server cores if needed, e.g., 4

error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 4096; # Increased for production
    use epoll;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log main buffer=32k flush=5s; # Buffered logs

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 75s; # Slightly longer keepalive
    keepalive_requests 1000; # Max requests per keepalive connection
    client_header_timeout 10s;
    client_body_timeout 10s;
    send_timeout 10s;
    types_hash_max_size 4096;
    server_tokens off; # Hide Nginx version
    client_max_body_size 256M; # Increased for potential large uploads/requests if any

    # SSL Session Cache
    ssl_session_cache shared:SSL:10m; # 10MB can store around 40,000 sessions
    ssl_session_timeout 10m;
    ssl_session_tickets off; # More secure to disable session tickets if not needed for specific clients

    # OCSP Stapling
    ssl_stapling on;
    ssl_stapling_verify on;
    # resolver 8.8.8.8 8.8.4.4 valid=300s; # Example Google DNS, use your server's resolver or ISP's
    # resolver_timeout 5s;

    # Gzip compression (same as dev, generally good)
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6; # Good balance
    gzip_types
      text/plain text/css text/xml text/javascript application/json
      application/javascript application/xml application/xml+rss
      application/atom+xml image/svg+xml;

    # Rate Limiting (more refined for production)
    # limit_req_zone $binary_remote_addr zone=api_general:20m rate=30r/s;
    # limit_req_zone $binary_remote_addr zone=api_generate:20m rate=5r/m; # 5 requests per minute for generation
    # limit_conn_zone $binary_remote_addr zone=conn_limit:10m;


    # Upstream definitions (same as dev nginx.conf)
    upstream frontend_service {
      server frontend:3000; # Assumes frontend service is named 'frontend' in docker-compose.prod.yml
      keepalive 64;
    }
    upstream n8n_service {
      server n8n:5678;
      keepalive 64;
    }
    upstream websocket_service {
      server websocket:8080; # Assumes websocket service is named 'websocket'
      keepalive 64;
    }

    # HTTP server block: Redirect all HTTP to HTTPS
    server {
        listen 80 default_server;
        listen [::]:80 default_server;
        server_name _; # Catch-all, or your specific domain(s)

        # If behind a load balancer that terminates SSL and forwards HTTP:
        # if ($http_x_forwarded_proto = 'http') {
        #   return 301 https://$host$request_uri;
        # }
        # For direct exposure or if this Nginx handles SSL:
        return 301 https://$host$request_uri;
    }

    # HTTPS server block
    server {
        listen 443 ssl http2 default_server;
        listen [::]:443 ssl http2 default_server;
        server_name ${DOMAIN_NAME}; # Use an environment variable for domain name, e.g., aimusic.studio

        # SSL Certificates (paths should match volume mounts in docker-compose.prod.yml)
        ssl_certificate /etc/nginx/ssl/fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/privkey.pem;
        # ssl_trusted_certificate /etc/nginx/ssl/chain.pem; # Optional: if you have a separate chain file

        # SSL Protocols and Ciphers (Modern compatibility)
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers off; # Modern clients choose best, 'on' can be slightly better for older clients but less flexible
        ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';

        # HSTS (HTTP Strict Transport Security) - forces HTTPS
        # Max-age is 2 years. includeSubDomains is optional. preload is for browser preloading.
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

        # Security Headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        # add_header Content-Security-Policy "default-src 'self' https: wss:; script-src 'self' 'unsafe-inline' https:; style-src 'self' 'unsafe-inline' https:; img-src 'self' data: https:; font-src 'self' https:; connect-src 'self' https: wss:;" always; # Strict CSP, needs careful tuning

        # Common locations (can be in an included file)
        location / {
           proxy_pass http://frontend_service;
           proxy_http_version 1.1;
           proxy_set_header Upgrade $http_upgrade;
           proxy_set_header Connection 'upgrade';
           proxy_set_header Host $host;
           proxy_set_header X-Real-IP $remote_addr;
           proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
           proxy_set_header X-Forwarded-Proto $scheme; # Should be 'https'
           proxy_cache_bypass $http_upgrade;

           # Add caching headers for static assets served by frontend_service if it's also nginx/apache
           # For SPAs, ensure all non-asset paths fall back to index.html (handled by frontend's internal server)
        }

        location ~ ^/(api|webhook|webhook-test|rest|healthz)/ {
            # limit_req zone=api_general burst=50 nodelay; # Example rate limit
            # if ($request_uri ~* "/generate-melody|/compose-track") { # More specific rate limit for generation
            #    limit_req zone=api_generate burst=10 nodelay;
            # }

            proxy_pass http://n8n_service;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 75s;
            proxy_send_timeout 600s;
            proxy_read_timeout 600s;
            proxy_buffering off;
        }

        location /ws/ {
            proxy_pass http://websocket_service;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }

        # Serving static audio files from /data/public (mounted to /var/www/public in nginx container)
        # These paths should match what frontend/AudioPlayer.js uses.
        location /api/audio/stems/ { # For stems
            alias /var/www/public/stems/; # Ensure this mount and path exist
            add_header Cache-Control "public, max-age=86400"; # Cache for 1 day
            autoindex off;
            # try_files $uri $uri/ =404; # Optional: return 404 if file not found
        }
        location /api/audio/mixed/ { # For mixed/mastered tracks
            alias /var/www/public/mixed/;
            add_header Cache-Control "public, max-age=86400";
            autoindex off;
        }
        location /api/download/ { # Forcing download
             root /var/www/public/; # Serve from root of public, path in URL will complete it
                                   # e.g. /api/download/stems/file.wav -> /var/www/public/stems/file.wav
            add_header Content-Disposition 'attachment';
            add_header Cache-Control "no-store";
            autoindex off;
        }

        location = /nginx_health {
           access_log off;
           return 200 "Nginx (prod) is healthy\n";
           add_header Content-Type text/plain;
        }

        location ~ /\. {
           deny all;
        }
    }

    # Include other specific configurations if needed
    # include /etc/nginx/conf.d/*.conf;
    # include /etc/nginx/sites-enabled/*;
}
