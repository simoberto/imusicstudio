# nginx/nginx.conf - Based on content from AI-Music-Studio-_parte2_.txt

user nginx; # Or the user Nginx runs as in its Docker image, e.g., nobody
worker_processes auto; # Auto-detect number of CPU cores

error_log /var/log/nginx/error.log warn; # Log errors to this file, warning level
pid /var/run/nginx.pid;

events {
    worker_connections 1024; # Max connections per worker
    use epoll;                # Use epoll for Linux, kqueue for BSD/macOS (auto usually works)
    multi_accept on;          # Accept multiple connections at once
}

http {
    include       /etc/nginx/mime.types; # Include MIME types
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    # Performance optimizations
    sendfile        on; # Enables sendfile() system call
    tcp_nopush      on; # Optimize packet delivery for sendfile
    tcp_nodelay     on; # Disable Nagle's algorithm
    keepalive_timeout  65s; # Keep-alive connection timeout
    types_hash_max_size 2048;
    client_max_body_size 100M; # Max allowed size of the client request body (e.g., for uploads)

    # Gzip compression
    gzip on;
    gzip_vary on; # Tell proxies to cache both gzipped and non-gzipped versions
    gzip_min_length 1024; # Don't compress files smaller than 1KB
    gzip_proxied any; # Compress for all proxied requests
    gzip_comp_level 6; # Compression level (1-9)
    gzip_types # Specify MIME types to compress
      text/plain
      text/css
      text/xml
      text/javascript
      application/json
      application/javascript
      application/xml
      application/xml+rss
      application/atom+xml
      image/svg+xml;

    # Rate limiting (example, adjust zones and rates as needed)
    # limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;      # For general API
    # limit_req_zone $binary_remote_addr zone=generate_limit:10m rate=2r/s; # For expensive generation endpoints

    # Upstream definitions for backend services
    # These names (frontend, n8n, websocket) must match the service names in docker-compose.yml
    upstream frontend_service { # Renamed to avoid conflict with potential 'frontend' server block name
      server frontend:3000; # Assumes frontend service runs on port 3000 internally
      keepalive 32;         # Keep-alive connections to upstream
    }

    upstream n8n_service {
      server n8n:5678;      # Assumes n8n service runs on port 5678 internally
      keepalive 32;
    }

    upstream websocket_service {
      server websocket:8080; # Assumes websocket service runs on port 8080 internally
      keepalive 32;
    }

    # Default server block - typically for HTTP on port 80, redirecting to HTTPS or serving frontend
    server {
        listen 80 default_server;
        listen [::]:80 default_server;
        server_name _; # Catch-all server name, or specify your domain e.g., localhost aimusic.studio

        # Redirect all HTTP traffic to HTTPS (recommended for production)
        # For development, you might serve directly or have different rules.
        # location / {
        #    return 301 https://$host$request_uri;
        # }
        # For now, let's assume this Nginx also handles SSL termination for production,
        # but the provided example seems to be more of a general proxy.
        # The docker-compose.yml maps 80:80 and 443:443, implying this Nginx handles both.

        # Security headers (good practice)
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        # add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self';" always; # Example CSP
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;


        # Serve frontend static files (React app)
        location / {
           proxy_pass http://frontend_service; # Proxy to the frontend service
           proxy_http_version 1.1;
           proxy_set_header Upgrade $http_upgrade; # For WebSockets if frontend uses them directly (though we have /ws)
           proxy_set_header Connection 'upgrade';
           proxy_set_header Host $host;
           proxy_set_header X-Real-IP $remote_addr;
           proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
           proxy_set_header X-Forwarded-Proto $scheme;
           proxy_cache_bypass $http_upgrade; # Don't cache WebSocket upgrades

           # Caching for static assets (if Nginx serves them directly, not just proxies)
           # If frontend_service is just Node serving HTML, these are less relevant here.
           # If frontend_service is Nginx serving static build, these are good.
           location ~* \.(?:css|js|jpg|jpeg|gif|png|ico|svg|woff|woff2|ttf|eot)$ {
               proxy_pass http://frontend_service; # Still proxy, but could set cache headers
               expires 1y; # Cache static assets for a long time
               add_header Cache-Control "public, immutable";
               access_log off; # Don't log access to static files
           }
        }

        # n8n API and Webhook endpoints
        # The path /api/ should match how n8n is exposed or how frontend calls it.
        # n8n webhooks are often at /webhook/ or /webhook-test/
        location ~ ^/(api|webhook|webhook-test|rest|healthz)/ { # Match common n8n paths
            # limit_req zone=api_limit burst=20 nodelay; # Apply rate limiting

            proxy_pass http://n8n_service; # Proxy to n8n service
            proxy_http_version 1.1;
            proxy_set_header Host $host; # Pass original host
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Increased timeouts for potentially long n8n operations (like AI generation)
            proxy_connect_timeout 75s;
            proxy_send_timeout 600s;  # 10 minutes for long generations
            proxy_read_timeout 600s;  # 10 minutes
            proxy_buffering off; # Useful for streaming responses if n8n supports it
        }

        # WebSocket connections for real-time updates
        location /ws/ { # Path for WebSocket, e.g., wss://domain.com/ws/
            proxy_pass http://websocket_service; # Proxy to the WebSocket service
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade; # Required for WebSocket
            proxy_set_header Connection "upgrade";   # Required for WebSocket
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 86400s; # Long timeout for persistent connections (24 hours)
            proxy_send_timeout 86400s;
        }

        # Location for serving generated audio files directly from /data volume
        # This requires the /data volume to be mounted to this Nginx container as well.
        # The docker-compose.yml mounts ./data/public to /var/www/public in nginx.
        location /api/audio/ { # Matches AudioPlayer.js src prefix
            alias /var/www/public/stems/; # Assuming stems are in /data/public/stems/ on host, mounted to /var/www/public
                                       # Adjust if stems are in /data/stems and /data is mounted directly
            # Example if /data itself is mounted at /srv/appdata in nginx container:
            # alias /srv/appdata/stems/;

            internal; # Optional: if only backend should trigger access, not direct user access.
                      # Remove if direct links to audio are needed.
                      # For now, allowing direct access for simplicity.

            add_header Cache-Control "public, max-age=3600"; # Cache for 1 hour
            # Secure file serving (prevent directory listing, etc.)
            autoindex off;
            # Optional: add content type headers if not set correctly by backend
            # types { audio/wav wav; audio/mpeg mp3; }
        }
        location /api/download/ { # Forcing download
             alias /var/www/public/stems/; # Or wherever the final mixed/mastered tracks are.
                                         # This path needs to be consistent.
                                         # If mixed tracks are in /data/mixed/, then /var/www/public/mixed/
            add_header Content-Disposition 'attachment'; # Force download
            add_header Cache-Control "no-store"; # Don't cache downloads
            autoindex off;
        }


        # Health check endpoint for this Nginx server itself
        location /nginx_health {
           access_log off;
           return 200 "Nginx is healthy\n";
           add_header Content-Type text/plain;
        }

        # Deny access to hidden files (e.g., .git, .env)
        location ~ /\. {
           deny all;
           access_log off;
           log_not_found off;
        }

        # Custom error pages (optional)
        # error_page 404 /404.html;
        # location = /404.html { root /usr/share/nginx/html; internal; }
        # error_page 500 502 503 504 /50x.html;
        # location = /50x.html { root /usr/share/nginx/html; internal; }
    }

    # HTTPS server block (for production)
    # This block would typically be in nginx.prod.conf or included.
    # For this main nginx.conf, we might omit it or keep it commented.
    # server {
    #    listen 443 ssl http2;
    #    listen [::]:443 ssl http2;
    #    server_name yourdomain.com www.yourdomain.com; # Replace with your actual domain

    #    ssl_certificate /etc/nginx/ssl/fullchain.pem; # Path to your SSL certificate
    #    ssl_certificate_key /etc/nginx/ssl/privkey.pem; # Path to your private key

    #    # SSL Ciphers and Protocols (example strong configuration)
    #    ssl_protocols TLSv1.2 TLSv1.3;
    #    ssl_prefer_server_ciphers off;
    #    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;

    #    # HSTS (Strict Transport Security)
    #    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    #    # Include common locations from HTTP or define them again
    #    # Often, common locations are put in a separate file and included in both server blocks.
    #    # location / { ... proxy_pass to frontend_service ... }
    #    # location /api/ { ... proxy_pass to n8n_service ... }
    #    # location /ws/ { ... proxy_pass to websocket_service ... }
    # }
}
