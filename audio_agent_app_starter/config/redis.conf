# config/redis.conf (Based on optimized docker-compose.yml from AI-Music-Studio-_parte2_.txt)

# Persistence
appendonly yes

# Memory Management
maxmemory 512mb
maxmemory-policy allkeys-lru

# RDB snapshotting rules (from docker-compose.yml command)
save 900 1   # after 900 sec (15 min) if at least 1 key changed
save 300 10  # after 300 sec (5 min) if at least 10 keys changed
save 60 1000 # after 60 sec if at least 1000 keys changed

# Default values often sufficient for other settings when run in Docker:
# port 6379
# bind 0.0.0.0 # Docker typically handles binding and exposure.
              # If using this conf file, Redis will bind to 127.0.0.1 by default if 'bind' is not specified.
              # To allow connections from other containers, you might need 'bind 0.0.0.0' or ensure 'protected-mode no'
              # if not using a password, but 'protected-mode yes' with a password is safer.
              # For inter-container communication on a Docker network, 0.0.0.0 or the container's IP is fine.
# protected-mode yes # Good default, means it only replies to loopback unless 'bind' is set or password given.
# timeout 0 # Default no client timeout, unless specific need
# tcp-keepalive 300 # Default

# To ensure Redis is accessible from other containers on the same Docker network,
# and if you are not setting a password (though recommended for production),
# you might need to explicitly set:
# bind 0.0.0.0
# protected-mode no
# OR, preferably, set a password:
# requirepass yoursecurepassword
# And then other services connect with the password.
# The docker-compose setup usually handles networking such that services can reach each other.
# The command line options in docker-compose for redis didn't specify bind, so it would use default.
# If this conf file is used, and no 'bind' is here, it defaults to 127.0.0.1,
# which might prevent other containers from connecting unless they are on the host network (not typical).
# Thus, for inter-container comms, explicitly setting bind or relying on Docker's default behavior for redis-server is key.
# Let's assume the default behavior of `redis-server` (without a conf file specified initially in docker-compose)
# binds appropriately for Docker, or that `protected-mode no` would be set if no password.
# For this conf file to be truly equivalent to the command line args, it should ensure same accessibility.
# The command args from docker-compose.yml didn't include bind or protected-mode, so Redis defaults apply.
# Redis default without explicit bind is 127.0.0.1 in protected mode.
# This means if this config file is used, we might need to add:
# bind 0.0.0.0
# To allow other docker containers on the same network to connect.
# However, often the Docker image for Redis might have a default config that already sets this.
# For now, sticking to direct translations of the command-line arguments.
# If connection issues arise, `bind 0.0.0.0` is the first thing to check/add here.
