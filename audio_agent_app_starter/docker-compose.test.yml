# audio_agent_app_starter/docker-compose.test.yml

version: "3.9"

# This docker-compose file is intended to be used for running integration tests.
# It defines a service that runs the test scripts against the main application stack,
# which should be running separately (or orchestrated together if this file is merged
# with the main docker-compose.yml for CI/CD).

services:
  test_runner:
    image: node:18-alpine # A lightweight Node.js image for running JS tests
    container_name: aimusic-integration-tests # Clear name for the test container

    volumes:
      # Mount the local 'test' directory (containing integration.test.js and any helpers)
      # into the container at /test.
      - ./test:/test
      # Optionally, mount the 'data' directory if tests need to interact with or verify
      # files generated by the application (e.g., output stems, mixes).
      # This path should match where the application's services write their data.
      - ./data:/data:ro # Mount as read-only if tests only verify existing files

    environment:
      # API_URL: Points to the entry point of the application being tested,
      # typically the Nginx reverse proxy of the main application stack.
      # 'nginx' is the service name of the Nginx container in the main docker-compose.yml.
      # Port 80 is used as Nginx listens on this port internally within the Docker network.
      - API_URL=http://nginx:80
      - NODE_ENV=test # Set Node environment to 'test'
      # CHAI_ शक्ति_NO_WARNINGS=true # Optional: Suppress Chai warnings if any specific ones are noisy
      # DEBUG=axios # Uncomment for verbose axios request/response logging during tests

    working_dir: /test # Set the working directory for the command

    # Command to install test dependencies and run the tests using Mocha.
    # Note: Installing dependencies every time the container runs is inefficient for local development.
    # For CI or frequent runs, consider creating a dedicated Docker image for testing
    # with these dependencies pre-installed.
    command: |
      sh -c "
        echo 'Installing test dependencies (axios, chai, mocha)...' &&
        apk add --no-cache git && \
        npm init -y && \
        npm install axios chai mocha --save-dev --no-fund --no-audit && \
        echo 'Running integration tests...' &&
        npx mocha integration.test.js --timeout 120000 --reporter spec --exit
      "
      # --reporter spec: Provides a readable test output.
      # --exit: Forces Mocha to exit after tests are done, which is important for CI.
      # --timeout 120000: Sets a 2-minute timeout for the entire test suite.

    # Networks:
    # The test_runner needs to be on the same Docker network as the application services
    # it's testing (nginx, n8n, etc.) so it can resolve them by service name (e.g., http://nginx).
    # This assumes your main docker-compose.yml creates a default network (e.g., audio_agent_app_starter_default).
    # If you have explicitly named networks in your main docker-compose.yml, you need to connect to them.
    # For clarity, if your main app uses a network called 'app_network':
    # default: # This service will join the 'default' network of this compose file
    #   external:
    #     name: audio_agent_app_starter_default # Explicitly join the main app's default network
    # Or simply rely on docker-compose merging if run together.
    # If main docker-compose has named networks like 'frontend_net', 'backend_net',
    # connect this test_runner to the network where 'nginx' is.
    # For simplicity, we assume it will connect to the default network created by the main app stack.
    # If your main docker-compose.yml has a specific network structure, adjust accordingly.
    # Example: if main app uses a network called 'aimusic_app_net'
    # aimusic_app_net:
    #   external: true
    # This service would then be:
    # networks:
    #  - aimusic_app_net
    # For now, let's assume the default shared network when run with the main compose file.
    # If you named your networks in the main docker-compose.yml, e.g., 'frontend_network', 'backend_network':
    # This test runner needs to be on the network where 'nginx' (the API_URL target) resides.
    # Assuming 'frontend' network from the main docker-compose.yml is where nginx is.
    networks:
      frontend_net: # This name MUST match a network defined in the main docker-compose.yml
        aliases:
          - integration-tester
      backend_net: # Also connect to backend if tests need to reach other services directly
        aliases:
          - integration-tester-backend-access


    # depends_on:
    # This section is more for `docker-compose up`. When using `docker-compose run test_runner`,
    # `depends_on` primarily ensures that the listed services are *started* if not already running
    # (and if they are defined in the *same* effective compose configuration).
    # It does not, by default, wait for them to be "healthy" before running the command.
    # Healthiness should be handled by a wait-for-it script or retries within the test script itself.
    # However, if services have healthchecks, `condition: service_healthy` can be useful
    # if these services are also part of the `up` command scope that includes `test_runner`.
    # For `docker-compose run`, it's often better to ensure the app stack is fully up and healthy *before*
    # running the test command.
    #
    # If these services (nginx, n8n) are defined in the main docker-compose.yml and this test file
    # is used in conjunction (e.g. `docker-compose -f main.yml -f test.yml run test_runner`),
    # then `depends_on` can start them.
    depends_on:
       nginx:
         condition: service_started # or service_healthy if nginx has a healthcheck
       n8n:
         condition: service_healthy # n8n has a healthcheck

# Define the networks if they are specific to the main application setup
# and this test runner needs to connect to them.
# If the main docker-compose.yml defines these networks, and this test file is
# used in conjunction, they will be available.
# If this test compose file is run standalone to test an already running environment,
# then these network definitions might need `external: true`.
networks:
  frontend_net: # Must match the network name in the main docker-compose.yml
    # external: true # Uncomment if the network is created by another docker-compose instance
    driver: bridge # Or keep default if managed by the same docker-compose execution context
  backend_net:  # Must match the network name in the main docker-compose.yml
    # external: true
    driver: bridge
