  <title>AI Music Studio - Create Music with AI</title>

  <style>
    /* Critical CSS for initial page load & loading spinner */
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      width: 100%;
      overflow: hidden; /* Prevent scrollbars during loading */
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Fira Sans', 'Droid Sans', 'Helvetica Neue', sans-serif;
      background: #111827; /* Tailwind gray-900, consistent with app theme */
    }

    .loading-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: linear-gradient(145deg, #1a1a2e 0%, #16213e 45%, #0f3460 100%); /* Darker gradient */
      display: flex;
      flex-direction: column; /* Stack spinner and text */
      align-items: center;
      justify-content: center;
      z-index: 99999; /* Ensure it's on top */
      transition: opacity 0.5s ease-out, visibility 0.5s ease-out; /* For smooth fade out */
      visibility: visible;
      opacity: 1;
    }

    .loading-spinner {
      width: 50px; /* Slightly larger */
      height: 50px;
      border: 4px solid rgba(139, 92, 246, 0.2); /* Tailwind purple-500/20 */
      border-top-color: #a78bfa; /* Tailwind violet-400 */
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    .loading-logo { /* Optional: if you have a small SVG logo */
      width: 60px;
      height: 60px;
      margin-bottom: 20px;
      /* background-image: url('%PUBLIC_URL%/logo-spinner.svg'); */
      /* background-size: contain; */
      /* background-repeat: no-repeat; */
      /* animation: pulse 1.5s ease-in-out infinite; */
    }

    .loading-text {
      color: #d1d5db; /* Tailwind gray-300 */
      margin-top: 20px;
      font-size: 1rem; /* 16px */
      font-weight: 500;
      letter-spacing: 0.025em;
    }

    /* Animation for spinner */
    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }
    /* Optional pulse animation for logo */
    /* @keyframes pulse { 0%, 100% { opacity: 0.8; transform: scale(0.95); } 50% { opacity: 1; transform: scale(1.05); } } */

    /* Class to hide loading screen once app is ready */
    body.app-loaded .loading-container {
      opacity: 0;
      visibility: hidden;
    }
    body.app-loaded {
        overflow: auto; /* Restore scrollbars after load */
    }
  </style>
</head>
<body>
  <noscript>
    <div style="background-color: #111827; color: white; padding: 20px; text-align: center; height: 100vh; display: flex; align-items: center; justify-content: center;">
      <h1>JavaScript is Required</h1>
      <p>You need to enable JavaScript to run AI Music Studio.</p>
    </div>
  </noscript>

  <!-- Initial loading screen -->
  <div class="loading-container" id="loading-screen">
    <!-- Optional: <div class="loading-logo"></div> -->
    <div class="loading-spinner"></div>
    <div class="loading-text">Loading AI Music Studio...</div>
  </div>

  <div id="root">
    <!-- React app will be injected here -->
