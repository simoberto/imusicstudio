# audio_agent_app_starter/frontend/nginx.conf
# Basic Nginx configuration for serving a React SPA (built with Create React App).

server {
    listen 3000; # Port the frontend container's Nginx will listen on
    server_name localhost; # Or specific if needed, but localhost is fine for internal container

    root /usr/share/nginx/html; # Default root for Nginx in its official image, where CRA build is copied
    index index.html index.htm;

    # Serve static files directly
    location ~* \.(?:css|js|jpg|jpeg|gif|png|ico|svg|woff|woff2|ttf|eot|json|map)$ {
        try_files $uri =404; # Try to serve file directly, else 404
        expires 1y; # Cache these static assets aggressively
        add_header Cache-Control "public, immutable";
        access_log off; # Don't log access to static assets
    }

    # For all other locations (SPA routing), serve index.html
    # This ensures that client-side routing works correctly.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Optional: Add Gzip compression for static assets (if not handled by a parent Nginx)
    gzip on;
    gzip_vary on;
    gzip_min_length 1000;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css application/json application/javascript application/x-javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml application/vnd.ms-fontobject application/x-font-ttf font/opentype;
    gzip_comp_level 6;

    # Optional: Basic security headers (can also be set by the main Nginx reverse proxy)
    # add_header X-Frame-Options "SAMEORIGIN";
    # add_header X-Content-Type-Options "nosniff";
    # add_header X-XSS-Protection "1; mode=block";

    # Health check endpoint (simple)
    location = /health {
        access_log off;
        return 200 "Frontend Nginx Healthy";
        add_header Content-Type text/plain;
    }
}
